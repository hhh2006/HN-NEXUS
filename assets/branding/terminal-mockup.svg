<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">HN NEXUS Terminal HUD Mockup</title>
  <desc id="desc">Illustrative SVG mockup of the HN // CIT three-row HUD concept. Not a real screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050810"/><stop offset="45%" stop-color="#08111f"/><stop offset="100%" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14d8aa"/><stop offset="50%" stop-color="#28a0eb"/><stop offset="100%" stop-color="#9b69f5"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#17263d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="28" fill="url(#grid)" opacity="0.45"/>
  <ellipse cx="240" cy="120" rx="260" ry="180" fill="#22d3ee" opacity="0.06"/>
  <ellipse cx="980" cy="620" rx="300" ry="200" fill="#8b5cf6" opacity="0.07"/>
  <g transform="translate(70,70)">
    <rect width="1060" height="580" rx="18" fill="#0b1220" fill-opacity="0.92" stroke="url(#frame)" stroke-width="1.5"/>
    <rect x="1" y="1" width="1058" height="42" rx="17" fill="#0f172a"/>
    <circle cx="28" cy="22" r="6" fill="#ff5f57"/><circle cx="50" cy="22" r="6" fill="#febc2e"/><circle cx="72" cy="22" r="6" fill="#28c840"/>
    <text x="530" y="27" text-anchor="middle" font-family="monospace" font-size="14" fill="#7f95b3">HN NEXUS // COMMAND CENTER — illustrative mockup (not a real screenshot)</text>
    <g transform="translate(36,86)" font-family="'DejaVu Sans Mono','Cascadia Mono',monospace">
      <text x="0" y="0" font-size="22" fill="#93a4bd">&#x256D;&#x2500;(</text>
      <text x="52" y="0" font-size="22" fill="#22d3ee" filter="url(#glow)">&#x25C8; HN</text>
      <text x="122" y="0" font-size="22" fill="#e6f7ff"> &#x2B21; CIT )</text>
      <rect x="240" y="-16" width="720" height="6" rx="3" fill="url(#rail)" opacity="0.95"/>
      <text x="970" y="0" font-size="22" fill="#93a4bd">&#x256E;</text>
      <text x="0" y="46" font-size="20" fill="#93a4bd">&#x2502;</text>
      <text x="26" y="46" font-size="20" fill="#6ee7b7">&#x25CF; kali@operator</text>
      <text x="255" y="46" font-size="20" fill="#54e7f4">&#x2302; ~/security-lab</text>
      <text x="490" y="46" font-size="20" fill="#a78bfa">&#x2442; main</text>
      <text x="610" y="46" font-size="20" fill="#f7c66b">&#x23F1; 0.08s</text>
      <text x="970" y="46" font-size="20" fill="#93a4bd">&#x256F;</text>
      <text x="0" y="92" font-size="20" fill="#93a4bd">&#x2570;&#x2500;</text>
      <text x="42" y="92" font-size="20" fill="#62e6b2" filter="url(#glow)">&#x25C8; READY</text>
      <text x="160" y="92" font-size="20" fill="#54e7f4">&#x276F;</text>
      <rect x="182" y="77" width="12" height="20" fill="#54e7f4" opacity="0.85"/>
      <g font-size="18" fill="#c8d6e8">
        <text x="0" y="150" fill="#64748b">$</text><text x="22" y="150">hnstatus</text>
        <text x="22" y="182" fill="#93a4bd">HN NEXUS · context/session snapshot (read-only)</text>
        <text x="0" y="224" fill="#64748b">$</text><text x="22" y="224">hnsuggest</text>
        <text x="22" y="256" fill="#54e7f4">&#x25C6; Git workspace detected</text>
        <text x="22" y="284" fill="#93a4bd">&#x21B3; git status --short --branch  ·  git log --oneline -n 10</text>
        <text x="0" y="326" fill="#64748b">$</text><text x="22" y="326">hnexplain "Permission denied"</text>
        <text x="22" y="358" fill="#f7c66b">Likely cause:</text><text x="175" y="358"> missing permissions or execute bit.</text>
        <text x="22" y="386" fill="#54e7f4">Try:</text><text x="70" y="386" fill="#93a4bd"> ls -l &lt;path&gt; · id · check ownership</text>
        <text x="0" y="428" fill="#64748b">$</text><text x="22" y="428" fill="#62e6b2"># local heuristics · no command executed</text>
      </g>
    </g>
  </g>
  <text x="600" y="690" text-anchor="middle" font-family="monospace" font-size="16" fill="#5f7391">HN // CIT COMMAND CENTER  ·  CYBER CITADEL AGENCY  ·  ENGINEERED BY HN</text>
</svg>