<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">HN NEXUS — Cinematic Command Center</title>
  <desc id="desc">HN // CIT · Cyber Citadel Agency · Engineered by Hani Khaled Nasser Al-Nasiri</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="45%" stop-color="#081428"/>
      <stop offset="100%" stop-color="#120a22"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17f1d1" stop-opacity="0.12"/>
      <stop offset="35%" stop-color="#2cb8ff" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#7c5cff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff5dd8" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4faff"/>
      <stop offset="45%" stop-color="#7ff6ff"/>
      <stop offset="75%" stop-color="#c7a6ff"/>
      <stop offset="100%" stop-color="#ffb0ec"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#8ff4ff"/>
      <stop offset="100%" stop-color="#d6b6ff"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17f1d1"/>
      <stop offset="55%" stop-color="#4f8dff"/>
      <stop offset="100%" stop-color="#9b6cff"/>
    </linearGradient>
    <radialGradient id="glowC" cx="22%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="78%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sealBg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#7c5cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sealGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#6ea8ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#glowC)"/>
  <rect width="1600" height="420" rx="28" fill="url(#glowV)"/>
  <rect x="24" y="24" width="1552" height="372" rx="22" fill="url(#grid)" opacity="0.55"/>
  <rect x="24" y="24" width="1552" height="372" rx="22" fill="none" stroke="url(#stroke)" stroke-width="2"/>

  <!-- Stylized citadel/seal motif (harmonious, self-contained) -->
  <g transform="translate(1315,210)">
    <circle r="165" fill="url(#sealBg)"/>
    <circle r="150" fill="none" stroke="#2cb8ff" stroke-opacity="0.30" stroke-width="1.5"/>
    <circle r="122" fill="none" stroke="#7c5cff" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="6 10"/>
    <circle r="96" fill="#0b1423" fill-opacity="0.55" stroke="#17f1d1" stroke-opacity="0.22" stroke-width="1"/>
    <g filter="url(#sealGlow)">
      <path d="M0 -72 L58 -44 L58 18 L0 50 L-58 18 L-58 -44 Z" fill="none" stroke="url(#sealGrad)" stroke-width="3.2"/>
      <path d="M0 -48 L38 -30 L38 8 L0 26 L-38 8 L-38 -30 Z" fill="none" stroke="#8ff4ff" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M-18 -28 L-18 -10 L-8 -10 L-8 -28 Z M8 -28 L8 -10 L18 -10 L18 -28 Z M-18 4 L18 4 L18 14 L-18 14 Z" fill="#e9f7ff" fill-opacity="0.9"/>
      <path d="M-30 18 L30 18 L22 34 L-22 34 Z" fill="url(#sealGrad)" fill-opacity="0.35" stroke="#bfefff" stroke-opacity="0.35"/>
      <circle r="5" fill="#7ff6ff"/>
    </g>
    <text y="128" text-anchor="middle" font-family="monospace,'Cascadia Mono','Consolas'" font-size="13" fill="#9fefff" letter-spacing="3">HN // CIT SEAL</text>
  </g>

  <g filter="url(#softGlow)">
    <rect x="108" y="78" width="592" height="34" rx="17" fill="#0b1423" fill-opacity="0.74" stroke="#27415f" stroke-opacity="0.9"/>
    <circle cx="132" cy="95" r="5" fill="#5ff0b6"/>
    <text x="148" y="101" font-family="monospace,'Cascadia Mono','Consolas'" font-size="14" fill="#bfefff" letter-spacing="1">HN // CIT · CYBER CITADEL AGENCY · ENGINEERED BY HN</text>

    <text x="110" y="170" font-family="'Segoe UI',system-ui,sans-serif" font-size="24" font-weight="700" fill="#8ff4ff" letter-spacing="7">CINEMATIC COMMAND CENTER</text>
    <text x="108" y="252" font-family="'Segoe UI',system-ui,sans-serif" font-size="92" font-weight="700" fill="url(#titleGrad)" letter-spacing="-2">HN NEXUS</text>
    <text x="112" y="304" font-family="'Segoe UI',system-ui,sans-serif" font-size="30" font-weight="500" fill="#d8e9fb">Engineered for control. Designed for precision.</text>
  </g>

  <text x="112" y="344" font-family="'Segoe UI',system-ui,sans-serif" font-size="23" fill="#9bb4d1">Created &amp; engineered by <tspan fill="url(#nameGrad)" font-weight="700">Hani Khaled Nasser Al-Nasiri</tspan></text>
  <text x="112" y="372" font-family="monospace,'Cascadia Mono','Consolas'" font-size="15" fill="#7f97b5">Cybersecurity Student — Al-Razi University · Pack v1.0.0 · Baseline 4.4.2 · Kali/ZSH · Local-first · Recovery-aware</text>
</svg>
