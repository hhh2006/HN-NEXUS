<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">HN NEXUS Architecture Mockup</title>
  <desc id="d">Illustrative architecture layers diagram. Not a runtime screenshot.</desc>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#070b14"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="l4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect width="900" height="520" rx="24" fill="url(#abg)"/>
  <text x="450" y="54" text-anchor="middle" font-family="monospace" font-size="22" fill="#e6f7ff" letter-spacing="3">HN NEXUS — LAYERED ARCHITECTURE</text>
  <text x="450" y="80" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b">Illustrative SVG diagram · ENGINEERED BY HN</text>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <g transform="translate(90,110)"><rect width="720" height="74" rx="12" fill="#0b1220" stroke="url(#l1)" stroke-width="1.5"/><text x="24" y="32" font-size="18" font-weight="700" fill="#22d3ee">01 · Interactive Shell Core</text><text x="24" y="56" font-size="14" fill="#93a4bd">ZSH hooks, completion, correction, prompt rendering — event-driven</text></g>
    <g transform="translate(90,200)"><rect width="720" height="74" rx="12" fill="#0b1220" stroke="url(#l2)" stroke-width="1.5"/><text x="24" y="32" font-size="18" font-weight="700" fill="#a78bfa">02 · HUD &amp; Context Engine</text><text x="24" y="56" font-size="14" fill="#93a4bd">Three-row responsive geometry, palettes, context markers, Git/runtime indicators</text></g>
    <g transform="translate(90,290)"><rect width="720" height="74" rx="12" fill="#0b1220" stroke="url(#l3)" stroke-width="1.5"/><text x="24" y="32" font-size="18" font-weight="700" fill="#34d399">03 · Prism &amp; Operator Utilities</text><text x="24" y="56" font-size="14" fill="#93a4bd">On-demand local tools: files/logs/data, process/network views, output analyzers</text></g>
    <g transform="translate(90,380)"><rect width="720" height="74" rx="12" fill="#0b1220" stroke="url(#l4)" stroke-width="1.5"/><text x="24" y="32" font-size="18" font-weight="700" fill="#f59e0b">04 · Recovery &amp; Verification</text><text x="24" y="56" font-size="14" fill="#93a4bd">Backups, rollback scripts, diagnostics, tests — no full system snapshot</text></g>
  </g>
</svg>