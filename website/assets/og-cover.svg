    <rect x="99" y="80" width="11" height="34" rx="2" fill="#0a1829" stroke="url(#title)"/><path d="M99 80 L99 72 L102.5 76 L104.5 69 L106.5 76 L110 72 L110 80 Z" fill="url(#title)" fill-opacity=".3"/>
    <rect x="82" y="74" width="16" height="40" rx="2.5" fill="#0b1a2c" stroke="#d7c2ff" stroke-opacity=".5"/>
    <path d="M82 74 L82 64 L86 69 L90 60 L94 69 L98 64 L98 74 Z" fill="url(#title)" fill-opacity=".36"/>
    <path d="M90 64 L90 52" stroke="#bfeeff" stroke-width="1.6" stroke-linecap="round"/><circle cx="90" cy="49" r="3" fill="#7ff6ff"/>
