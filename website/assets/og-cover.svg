    <rect x="492" y="548" width="170" height="32" rx="8" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".35"/><text x="577" y="569" text-anchor="middle" fill="#c7a6ff">baseline 4.4.2</text>
    <rect x="674" y="548" width="170" height="32" rx="8" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-opacity=".35"/><text x="759" y="569" text-anchor="middle" fill="#7ff0c0">local-first</text>
