  <text x="64" y="592" font-family="'DM Mono','Cascadia Mono',Consolas,monospace" font-size="13" fill="#5f7f9f" letter-spacing="1.5">github.com/hhh2006/HN-NEXUS · https://hhh2006.github.io/HN-NEXUS/</text>
