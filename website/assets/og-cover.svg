    <rect x="72" y="94" width="36" height="20" rx="2.5" fill="#0b1a2c" stroke="#bfeeff" stroke-opacity=".45"/>
    <path d="M84 114 L84 102 Q90 96 96 102 L96 114 Z" fill="#07111f" stroke="#8ff4ff" stroke-opacity=".65"/>
