<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HN NEXUS — Cinematic Command Center</title>
  <desc id="desc">HN NEXUS by Hani Khaled Nasser Al-Nasiri. HN // CIT · Cyber Citadel Agency · Engineered by HN.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#03060c"/><stop offset="45%" stop-color="#081423"/><stop offset="100%" stop-color="#100a22"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7ff6ff"/><stop offset="35%" stop-color="#2cb8ff"/><stop offset="70%" stop-color="#8b7cff"/><stop offset="100%" stop-color="#ff8fe6"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#17f1d1" stop-opacity="0"/><stop offset="20%" stop-color="#17f1d1"/><stop offset="50%" stop-color="#4f8dff"/><stop offset="80%" stop-color="#ff5dd8"/><stop offset="100%" stop-color="#ff5dd8" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="50%" stop-color="#7c5cff" stop-opacity=".18"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8fdfff" stroke-opacity=".06" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="980" cy="120" rx="360" ry="140" fill="url(#line)" opacity=".25" filter="url(#blur)"/>
  <ellipse cx="250" cy="520" rx="320" ry="140" fill="url(#line)" opacity=".18" filter="url(#blur)"/>
  <circle cx="200" cy="315" r="170" fill="url(#glow)" filter="url(#blur)"/>
  <rect x="28" y="28" width="1144" height="574" rx="26" fill="none" stroke="url(#title)" stroke-opacity=".28"/>

