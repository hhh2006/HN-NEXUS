name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: HN NEXUS version
      placeholder: 4.4.2
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: OS, ZSH version and terminal
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations: { required: true }
  - type: textarea
    id: tests
    attributes:
      label: Sanitized test output
      description: Remove usernames, hostnames, IPs, tokens and other sensitive data.
